name: Check website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danielrjackson/synaptic-lens
          path: library
          persist-credentials: false
      - run: python3 scripts/check_neuron_demo.py
      - run: node scripts/check_neuron_impact.mjs
      - name: Verify gallery pixels and provenance
        run: |
          python3 -m venv /tmp/gallery-check
          /tmp/gallery-check/bin/pip install Pillow==13.0.0
          /tmp/gallery-check/bin/python scripts/check_training_gallery.py
      - run: python3 scripts/build.py --library library --output dist
      - run: python3 scripts/check_links.py dist
